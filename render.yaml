services:
  - type: web
    name: iskolar-api
    runtime: node
    rootDir: web/server
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health/readiness
    plan: standard
    region: singapore
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STORAGE_DRIVER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        value: iskolar-documents
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_SECURE
        value: "true"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CORS_ORIGINS
        value: "https://iskolar.vercel.app,https://iskolar.ph,https://iskolar.pages.dev,https://client-gamma-hazel-97.vercel.app"
      - key: ALLOW_TEST_OVERRIDE
        value: "false"
