<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ISKOLAR — Scholarship Management & Verification Desk</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="description" content="ISKOLAR connects Filipino college students with verified scholarship providers through transparent applications, document-assisted verification, and structured evaluation." />

    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('iskolar_theme');
          var theme = savedTheme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
